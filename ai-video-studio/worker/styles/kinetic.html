<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Style reference: kinetic (fictional gym)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0b0b0b; font-family: var(--brand-font); color: #fff; }
  .abs { position: absolute; inset: 0; overflow: hidden; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.25) saturate(1.3); }
  .tint { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; line-height: .9; letter-spacing: -.02em; z-index: 10; }
  .block { position: absolute; z-index: 8; }
  #flash { background: #fff; z-index: 20; }
</style>
</head>
<body>
<div id="stage" class="abs"></div>
<div id="fx" class="abs" style="z-index:8"></div>
<div id="words" class="abs" style="z-index:10"></div>
<div id="flash" class="abs" style="opacity:0"></div>
<script>
const DURATION = 15;
window.AD_DURATION = DURATION;
const A = window.ASSETS;
const W = innerWidth, H = innerHeight, U = Math.min(W, H) / 100;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, l) => clamp((t - s) / l);
const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeOut = (x) => 1 - Math.pow(1 - x, 4);
const $ = (id) => document.getElementById(id);
const YELLOW = "#e8ff1a", RED = "#ff2d3d";

// Beat grid: 128 BPM -> one beat = 0.469s. Cuts land on beats.
const B = 60 / 128;
// Each cut: kind 'photo' (img, punch zoom, tint) or 'type' (solid color + word), plus a word to slam in.
const CUTS = [
  { at: 0, kind: "type", bg: "#0b0b0b", word: "בלי", color: "#fff", size: 26 },
  { at: 2 * B, kind: "type", bg: RED, word: "תירוצים.", color: "#fff", size: 22 },
  { at: 4 * B, kind: "photo", img: 0, word: "כוח", color: YELLOW, size: 34, tint: "rgba(255,45,61,.0)" },
  { at: 7 * B, kind: "photo", img: 1, word: "אנרגיה", color: "#fff", size: 25 },
  { at: 10 * B, kind: "photo", img: 2, word: "תוצאות", color: YELLOW, size: 25 },
  { at: 13 * B, kind: "split" },
  { at: 17 * B, kind: "type", bg: YELLOW, word: "האימון הראשון", color: "#0b0b0b", size: 15, sub: "עלינו." },
  { at: 22 * B, kind: "end" },
];
const cutEnd = (i) => (i + 1 < CUTS.length ? CUTS[i + 1].at : DURATION);

const stage = $("stage");
const els = CUTS.map((c) => {
  const d = document.createElement("div"); d.className = "abs shot";
  if (c.kind === "photo") d.innerHTML = `<img src="${A.images[c.img % A.images.length]}"><div class="tint" style="background:linear-gradient(120deg, rgba(255,45,61,.35), transparent 60%)"></div>`;
  else if (c.kind === "split") d.innerHTML = [0, 1, 2].map((k) => `<div style="position:absolute;top:0;bottom:0;left:${k * 33.34}%;width:33.34%;overflow:hidden;border-left:${k ? 10 : 0}px solid #0b0b0b"><img src="${A.images[k % A.images.length]}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.25) saturate(1.3) grayscale(${k === 1 ? 0 : .6})"></div>`).join("");
  else if (c.kind === "end") d.style.background = "#0b0b0b";
  else d.style.background = c.bg;
  stage.append(d); return d;
});
const wordEls = CUTS.map((c) => {
  const d = document.createElement("div"); d.className = "word"; d.dir = "rtl";
  if (c.word) {
    d.style.fontSize = c.size * U + "px"; d.style.color = c.color; d.style.top = "50%";
    d.innerHTML = c.word + (c.sub ? `<div style="font-size:${c.size * 1.25 * U}px;color:${RED}">${c.sub}</div>` : "");
    d.style.textShadow = c.kind === "photo" ? "0 10px 50px rgba(0,0,0,.6)" : "none";
  }
  $("words").append(d); return d;
});
// End card: logo lockup
const endEl = document.createElement("div"); endEl.className = "word"; endEl.style.top = "26%";
endEl.innerHTML = `<div id="logo" style="font-size:${21 * U}px;direction:ltr;font-style:italic">PULSE<span style="color:${YELLOW}">.</span></div>
  <div id="endBar" style="height:${1.6 * U}px;width:${54 * U}px;margin:${2 * U}px auto;background:${RED}"></div>
  <div id="endCta" dir="rtl" style="font-size:${6 * U}px;font-weight:800">אימון ניסיון חינם · הירשמו היום</div>
  <div id="endSite" style="font-size:${3.2 * U}px;font-weight:700;color:${YELLOW};margin-top:${2 * U}px;direction:ltr">PULSE-GYM.CO.IL</div>`;
$("words").append(endEl);

// diagonal color blocks that wipe through on some cuts
const fx = $("fx");
const blocks = [RED, YELLOW, "#fff"].map((c) => { const d = document.createElement("div"); d.className = "block"; d.style.background = c; d.style.width = "140%"; d.style.height = 28 * U + "px"; d.style.left = "-20%"; fx.append(d); return d; });
const WIPES = [CUTS[2].at, CUTS[5].at, CUTS[7].at];

window.renderFrame = function (t) {
  const idx = CUTS.reduce((acc, c, i) => (t >= c.at ? i : acc), 0);
  CUTS.forEach((c, i) => {
    const on = i === idx;
    els[i].style.display = on ? "block" : "none";
    wordEls[i].style.display = on && c.word ? "block" : "none";
    if (!on) return;
    const local = t - c.at, len = cutEnd(i) - c.at;
    // punch-in zoom with a tiny shake on the beat
    const punch = 1 + 0.18 * (1 - easeOut(clamp(local / 0.35))) + 0.06 * (local / len);
    const shake = local < 0.18 ? Math.sin(local * 90) * 1.2 * U * (1 - local / 0.18) : 0;
    els[i].style.transform = c.kind === "type" ? "none" : `scale(${punch}) translateX(${shake}px)`;
    if (c.kind === "split") {
      [...els[i].children].forEach((p, k) => { const pk = easeOut(prog(local, k * 0.15, 0.35)); p.style.transform = `translateY(${(1 - pk) * (k % 2 ? -100 : 100)}%)`; });
    }
    if (c.word) {
      const p = back(prog(local, 0.02, 0.32));
      wordEls[i].style.transform = `translateY(-50%) scale(${0.2 + 0.8 * p}) rotate(${(1 - p) * -8}deg)`;
      wordEls[i].style.opacity = clamp(local / 0.08);
    }
  });

  // flash on cuts into photos
  let fl = 0;
  CUTS.forEach((c) => { if (c.kind !== "type" && t >= c.at) fl = Math.max(fl, 1 - (t - c.at) / 0.12); });
  $("flash").style.opacity = t >= 0.05 ? clamp(fl) * 0.8 : 0;

  // diagonal wipes
  let wipe = -1;
  WIPES.forEach((w) => { const d = (t - w + 0.25) / 0.5; if (d >= 0 && d <= 1) wipe = d; });
  blocks.forEach((b, k) => {
    b.style.display = wipe >= 0 ? "block" : "none";
    if (wipe < 0) return;
    const x = (wipe * 2.4 - 1.2 - k * 0.12) * W;
    b.style.transform = `translateX(${x}px) rotate(-12deg)`;
    b.style.top = 20 + k * 22 + "%";
  });

  // end card
  const e = t >= CUTS[7].at;
  endEl.style.display = e ? "block" : "none";
  if (e) {
    const l = t - CUTS[7].at;
    $("logo").style.transform = `scale(${0.3 + 0.7 * back(prog(l, 0.05, 0.4))})`;
    $("endBar").style.transform = `scaleX(${easeOut(prog(l, 0.35, 0.4))})`;
    $("endCta").style.opacity = prog(l, 0.6, 0.3);
    $("endCta").style.transform = `translateY(${(1 - easeOut(prog(l, 0.6, 0.4))) * 30}px)`;
    $("endSite").style.opacity = prog(l, 0.9, 0.3);
  }
};
renderFrame(0);
</script>
</body>
</html>
