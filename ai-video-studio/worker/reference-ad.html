<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Reference edit: photo-based commercial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: var(--brand-font); }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  #stage { isolation: isolate; z-index: 0; } /* scenes stack inside the stage, under text layers */
  .scene { will-change: transform, opacity, clip-path; }
  .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .grade { position: absolute; inset: 0; mix-blend-mode: soft-light; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.15) 45%, rgba(0,0,0,.35) 100%); }
  #vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #leak { mix-blend-mode: screen; }
  #grain { mix-blend-mode: overlay; opacity: .22; }
  #flash { background: #fff; }
  .headline { position: absolute; color: #fff; font-weight: 900; line-height: 1.02; letter-spacing: -.01em; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .headline span { display: inline-block; }
  .bar { position: absolute; height: 8px; border-radius: 4px; }
  #captions { position: absolute; left: 0; right: 0; text-align: center; }
  #captions .chip { display: inline-block; padding: .18em .5em; border-radius: .35em; background: rgba(0,0,0,.55); color: #fff; font-weight: 700; }
  #captions .w { opacity: .78; }
  #captions .w.on { opacity: 1; color: var(--accent); }
  #end { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; }
  #end img { object-fit: contain; }
  #cta { margin-top: .6em; padding: .35em 1.1em; border-radius: 999px; font-weight: 800; color: #fff; }
  #site { margin-top: .7em; font-weight: 600; opacity: .9; direction: ltr; }
</style>
</head>
<body>
<div id="stage" class="layer"></div>
<div id="vignette" class="layer"></div>
<canvas id="grain" class="layer"></canvas>
<div id="leak" class="layer"></div>
<div id="flash" class="layer" style="opacity:0"></div>
<div id="heads" class="layer"></div>
<div id="captions" dir="rtl"></div>
<div id="end" class="layer" style="opacity:0" dir="rtl">
  <img id="endLogo" alt="">
  <div id="endBrand" style="font-weight:900"></div>
  <div id="cta"></div>
  <div id="site"></div>
</div>
<script>
// ------------------------------------------------------------------ brand (filled in per customer)
const BRAND = {
  name: "Pizza Roma",
  cta: "הזמינו עכשיו",
  website: "pizza-roma.co.il",
  accent: "#ff5a36",
  grade: "rgba(255,140,60,.35)", // warm grade for food; teal/cool for tech, etc.
};
document.documentElement.style.setProperty("--accent", BRAND.accent);

// ------------------------------------------------------------------ data from the renderer
const A = window.ASSETS;
const SCENES = A.timeline.scenes;
const WORDS = A.timeline.words;
const DURATION = SCENES.length ? SCENES[SCENES.length - 1].end : 10;
window.AD_DURATION = DURATION;

// ------------------------------------------------------------------ toolkit (pure functions of t)
const W = window.innerWidth, H = window.innerHeight, U = Math.min(W, H) / 100; // 1U = 1% of the short edge
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, len) => clamp((t - start) / len);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const backOut = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
const TR = 0.7;          // transition length (s)
const END_LEN = 2.6;     // end card length (s)

// ------------------------------------------------------------------ build the scenes once
const stage = $("stage"), heads = $("heads");
const sceneEls = SCENES.map((s, i) => {
  const el = document.createElement("div");
  el.className = "layer scene";
  const img = document.createElement("img");
  img.src = A.images[s.image] || A.images[0];
  const grade = document.createElement("div");
  grade.className = "grade";
  grade.style.background = BRAND.grade;
  const shade = document.createElement("div");
  shade.className = "shade";
  el.append(img, grade, shade);
  stage.append(el);

  const head = document.createElement("div");
  head.className = "headline";
  head.dir = "rtl";
  const size = (W > H ? 8.2 : 9.5) * U;
  head.style.fontSize = size + "px";
  head.style.right = 7 * U + "px";
  head.style.left = 7 * U + "px";
  head.style.bottom = (W > H ? 24 : 30) * U + "px";
  head.innerHTML = s.onScreenText.split(" ").map((w) => `<span>${w}&nbsp;</span>`).join("");
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.style.background = BRAND.accent;
  bar.style.right = 7 * U + "px";
  bar.style.bottom = (W > H ? 21.5 : 27.5) * U + "px";
  heads.append(head, bar);

  // deterministic per-scene motion: alternate push-in / pull-out and pan direction
  const dir = i % 2 ? -1 : 1;
  return { el, img, head, bar, words: [...head.children], motion: { from: i % 2 ? 1.16 : 1.02, to: i % 2 ? 1.04 : 1.14, pan: dir * 2.2 } };
});

// captions: phrases of up to 6 words that never cross a scene boundary
const phrases = [];
{
  let cur = [];
  WORDS.forEach((w, i) => {
    const sceneOf = (x) => SCENES.findIndex((s) => x.start >= s.start && x.start < s.end);
    if (cur.length && (cur.length >= 6 || sceneOf(w) !== sceneOf(cur[0]))) { phrases.push(cur); cur = []; }
    cur.push(w);
  });
  if (cur.length) phrases.push(cur);
}
const cap = $("captions");
cap.style.bottom = (W > H ? 7 : 11) * U + "px";
cap.style.fontSize = (W > H ? 4.2 : 5) * U + "px";
cap.style.padding = `0 ${7 * U}px`;

// film grain: a few noise frames, picked by frame number
const grain = $("grain");
grain.width = Math.round(W / 3); grain.height = Math.round(H / 3);
const gctx = grain.getContext("2d");
const noise = Array.from({ length: 6 }, () => {
  const d = gctx.createImageData(grain.width, grain.height);
  for (let p = 0; p < d.data.length; p += 4) { const v = Math.random() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
  return d;
});

// end card
const endLogo = $("endLogo");
if (A.logo) { endLogo.src = A.logo; endLogo.style.maxWidth = 40 * U + "px"; endLogo.style.maxHeight = 22 * U + "px"; endLogo.style.marginBottom = 3 * U + "px"; }
else endLogo.style.display = "none";
$("endBrand").textContent = BRAND.name;
$("endBrand").style.fontSize = (A.logo ? 6 : 11) * U + "px";
$("cta").textContent = BRAND.cta;
$("cta").style.fontSize = 6 * U + "px";
$("cta").style.background = BRAND.accent;
$("site").textContent = BRAND.website;
$("site").style.fontSize = 4 * U + "px";
$("end").style.background = "radial-gradient(ellipse at center, rgba(20,10,5,.55), rgba(0,0,0,.88))";

// ------------------------------------------------------------------ one frame
function renderFrame(t) {
  const endStart = DURATION - END_LEN;

  SCENES.forEach((s, i) => {
    const e = sceneEls[i];
    const local = clamp((t - s.start) / (s.end - s.start));
    // in/out windows around the cut points
    const inP = i === 0 ? 1 : easeInOut(prog(t, s.start - TR / 2, TR));
    const outP = i === SCENES.length - 1 ? 0 : easeInOut(prog(t, s.end - TR / 2, TR));
    const visible = t >= s.start - TR / 2 && t <= s.end + TR / 2;
    e.el.style.display = visible ? "block" : "none";
    e.head.style.display = visible ? "block" : "none";
    e.bar.style.display = visible ? "block" : "none";
    if (!visible) return;

    // Ken Burns on the photo
    const k = easeInOut(local);
    const scale = lerp(e.motion.from, e.motion.to, k);
    e.img.style.transform = `scale(${scale}) translateX(${lerp(-e.motion.pan, e.motion.pan, k)}%)`;

    // transition style rotates per cut: dissolve+zoom, push, circular reveal, flash
    const kind = i % 4;
    let opacity = 1, transform = "", clip = "none";
    if (inP < 1) {
      if (kind === 1) transform = `translateX(${(1 - inP) * -100}%)`;
      else if (kind === 2) clip = `circle(${inP * 75}% at 50% 50%)`;
      else opacity = inP;
    }
    if (outP > 0) {
      const nextKind = (i + 1) % 4;
      if (nextKind === 1) transform = `translateX(${outP * 35}%)`;
      else if (nextKind === 0 || nextKind === 3) { transform = `scale(${1 + outP * 0.25})`; opacity = Math.min(opacity, 1 - outP * 0.6); }
    }
    e.el.style.opacity = opacity;
    e.el.style.transform = transform;
    e.el.style.clipPath = clip;
    e.el.style.zIndex = String(i);

    // headline: words rise in one by one, then hold, then leave before the cut
    const hideAtEnd = t > endStart - 0.2 ? 0 : 1;
    const headOut = 1 - prog(t, s.end - TR, TR * 0.6);
    e.words.forEach((w, j) => {
      const p = backOut(prog(t, s.start + 0.25 + j * 0.09, 0.55));
      w.style.transform = `translateY(${(1 - p) * 60}%)`;
      w.style.opacity = clamp(p * 1.4) * headOut * hideAtEnd;
    });
    const bp = easeOut(prog(t, s.start + 0.15, 0.6));
    e.bar.style.width = bp * 14 * U + "px";
    e.bar.style.opacity = headOut * hideAtEnd;
  });

  // flash on every 4th cut
  let flash = 0;
  SCENES.forEach((s, i) => { if (i > 0 && i % 4 === 3) flash = Math.max(flash, 1 - Math.abs(t - s.start) / 0.18); });
  $("flash").style.opacity = clamp(flash) * 0.85;

  // light leak sweeping across at each cut
  let leak = 0, leakX = 50;
  SCENES.forEach((s, i) => { if (i > 0) { const d = (t - s.start) / 0.9; if (d > -1 && d < 1) { leak = Math.max(leak, 1 - Math.abs(d)); leakX = 50 + d * 60; } } });
  $("leak").style.background = `radial-gradient(ellipse 45% 70% at ${leakX}% 40%, rgba(255,170,90,${0.55 * leak}), transparent 70%)`;

  // grain
  gctx.putImageData(noise[Math.floor(t * 24) % noise.length], 0, 0);

  // captions synced to the narration
  const ph = phrases.find((p) => t >= p[0].start - 0.05 && t <= p[p.length - 1].end + 0.35);
  const showCaps = ph && t < endStart;
  if (showCaps) {
    const html = ph.map((w) => `<span class="w${t >= w.start && t <= w.end + 0.05 ? " on" : ""}">${w.text}</span>`).join(" ");
    if (cap.dataset.html !== html) { cap.innerHTML = `<span class="chip">${html}</span>`; cap.dataset.html = html; }
  }
  cap.style.opacity = showCaps ? 1 : 0;

  // end card
  const ep = easeOut(prog(t, endStart, 0.6));
  const end = $("end");
  end.style.opacity = ep;
  end.style.transform = `scale(${lerp(1.06, 1, ep)})`;
  $("cta").style.transform = `scale(${backOut(prog(t, endStart + 0.35, 0.5))})`;
  $("site").style.opacity = prog(t, endStart + 0.6, 0.4);
}
window.renderFrame = renderFrame;
renderFrame(0);
</script>
</body>
</html>
